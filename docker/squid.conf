http_port 127.0.0.1:3128

# Whitelist of allowed domains (extracted from http-domain-whitelist in opencode-sandbox-config.yaml)
acl whitelist dstdomain "/etc/squid/squid-whitelist.txt"

# Restrict proxy access to localhost only (prevents Docker-bridge peers from using this proxy)
acl localnet src 127.0.0.1/32

# Standard port ACLs
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Deny CONNECT to non-SSL ports
http_access deny CONNECT !SSL_ports

# Deny requests to non-safe ports
http_access deny !Safe_ports

# Allow whitelisted domains from localhost only
http_access allow localnet whitelist

# Deny everything else
http_access deny all

# Suppress access log noise to stdout
access_log none
cache_log /dev/null
cache_store_log none

# Memory-only cache: cookies/objects are unimportant for a whitelisting forward
# proxy, and an explicit `cache_dir null` overrides squid's compiled-in disk
# default (ufs /var/spool/squid), which would otherwise need `squid -z`
# initialization — impossible on a freshly-mounted tmpfs.
cache_dir null /tmp
cache_mem 16 MB

# No proxy-owned runtime dir exists: the entrypoint deliberately cannot chown
# (the cap set has no CAP_CHOWN), so squid must not need a writable dir of its
# own. `pid_filename none` disables the pid file entirely; cores (only on a
# crash) go to the world-writable /tmp tmpfs. Cache is memory-only
# (cache_dir null) and logs are nulled above, so nothing else is written.
pid_filename none
coredump_dir /tmp

# Suppress all squid debug/startup messages
debug_options ALL,0

